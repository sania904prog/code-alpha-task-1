<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator - CodeAlpha Internship</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
    
    body {
      background: #0f0f1a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #fff;
    }

    .calculator {
      background: #1f1f2e;
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 0 30px #8b5cf640;
      width: 320px;
    }

    .display {
      background: #0f0f1a;
      color: #fff;
      font-size: 2.5rem;
      padding: 20px;
      border-radius: 12px;
      text-align: right;
      margin-bottom: 20px;
      overflow: hidden;
      border: 2px solid #8b5cf6;
      min-height: 80px;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    button {
      padding: 20px;
      font-size: 1.2rem;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      background: #2a2a3d;
      color: #fff;
      transition: 0.2s;
      font-weight: 600;
    }

    button:hover { background: #3a3a50; transform: scale(0.95); }
    
    .operator { background: #8b5cf6; color: #fff; }
    .operator:hover { background: #7c3aed; }
    
    .equals { background: #22c55e; grid-column: span 2; }
    .equals:hover { background: #16a34a; }
    
    .clear { background: #ef4444; }
    .clear:hover { background: #dc2626; }

    header { text-align: center; margin-bottom: 15px; }
    header h2 { color: #8b5cf6; font-size: 1.3rem; }
  </style>
</head>
<body>
  <div class="calculator">
    <header>
      <h2>CodeAlpha Calculator</h2>
    </header>

    <div class="display" id="display">0</div>

    <div class="buttons">
      <button class="clear" onclick="clearDisplay()">C</button>
      <button onclick="deleteLast()">DEL</button>
      <button class="operator" onclick="appendValue('/')">/</button>
      <button class="operator" onclick="appendValue('*')">*</button>

      <button onclick="appendValue('7')">7</button>
      <button onclick="appendValue('8')">8</button>
      <button onclick="appendValue('9')">9</button>
      <button class="operator" onclick="appendValue('-')">-</button>

      <button onclick="appendValue('4')">4</button>
      <button onclick="appendValue('5')">5</button>
      <button onclick="appendValue('6')">6</button>
      <button class="operator" onclick="appendValue('+')">+</button>

      <button onclick="appendValue('1')">1</button>
      <button onclick="appendValue('2')">2</button>
      <button onclick="appendValue('3')">3</button>
      <button class="equals" onclick="calculate()">=</button>

      <button onclick="appendValue('0')" style="grid-column: span 2;">0</button>
      <button onclick="appendValue('.')">.</button>
    </div>
  </div>

  <script>
    const display = document.getElementById('display');
    let currentInput = '0';

    function updateDisplay() {
      display.textContent = currentInput;
    }

    function appendValue(value) {
      if (currentInput === '0' && value !== '.') {
        currentInput = value;
      } else {
        currentInput += value;
      }
      updateDisplay();
    }

    function clearDisplay() {
      currentInput = '0';
      updateDisplay();
    }

    function deleteLast() {
      currentInput = currentInput.slice(0, -1);
      if (currentInput === '') currentInput = '0';
      updateDisplay();
    }

    function calculate() {
      try {
        currentInput = eval(currentInput).toString();
        updateDisplay();
      } catch (error) {
        display.textContent = 'Error';
        currentInput = '0';
      }
    }

    // Keyboard Support - Bonus
    document.addEventListener('keydown', (e) => {
      if (e.key >= '0' && e.key <= '9' || e.key === '.') appendValue(e.key);
      if (e.key === '+' || e.key === '-' || e.key === '*' || e.key === '/') appendValue(e.key);
      if (e.key === 'Enter') calculate();
      if (e.key === 'Backspace') deleteLast();
      if (e.key === 'Escape') clearDisplay();
    });
  </script>
</body>
</html>

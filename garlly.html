<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Gallery - CodeAlpha Internship</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Poppins', sans-serif;
      background: #0f0f1a;
      color: #fff;
      padding: 20px;
    }

    header { text-align: center; margin-bottom: 30px; }
    header h1 { color: #8b5cf6; font-size: 2.2rem; }
    header p { color: #aaa; }

    /* Filters */
   .filters { text-align: center; margin-bottom: 25px; }
   .filter-btn {
      background: #1f1f2e; color: #fff; border: 1px solid #8b5cf6;
      padding: 10px 18px; margin: 5px; border-radius: 25px; cursor: pointer;
      transition: 0.3s; font-weight: 500;
    }
   .filter-btn.active,.filter-btn:hover { background: #8b5cf6; transform: scale(1.05); }

    /* Gallery Grid */
   .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }
   .gallery-item {
      overflow: hidden; border-radius: 15px; cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      position: relative;
    }
   .gallery-item:hover { transform: scale(1.05); box-shadow: 0 0 20px #8b5cf680; }
   .gallery-item img { width: 100%; height: 250px; object-fit: cover; display: block; }

    /* Lightbox */
   .lightbox {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.95); justify-content: center; align-items: center;
      z-index: 1000; backdrop-filter: blur(5px);
    }
   .lightbox-img { max-width: 90%; max-height: 85%; border-radius: 15px; border: 3px solid #8b5cf6; }
   .close,.prev,.next {
      position: absolute; color: white; font-size: 45px; cursor: pointer;
      user-select: none; transition: 0.3s; font-weight: bold;
    }
   .close { top: 20px; right: 40px; }
   .prev { left: 30px; top: 50%; transform: translateY(-50%); }
   .next { right: 30px; top: 50%; transform: translateY(-50%); }
   .close:hover,.prev:hover,.next:hover { color: #8b5cf6; }

    /* Responsive */
    @media(max-width: 600px) {
     .gallery { grid-template-columns: 1fr; }
     .close { font-size: 35px; right: 20px; }
     .prev,.next { font-size: 35px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>My Image Gallery</h1>
    <p>Task 1 - Frontend Intern @CodeAlpha</p>
  </header>

  <!-- Filter Buttons -->
  <div class="filters">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="nature">Nature</button>
    <button class="filter-btn" data-filter="tech">Tech</button>
  </div>

  <!-- Image Gallery Grid -->
  <div class="gallery">
    <div class="gallery-item" data-category="nature">
      <img src="https://picsum.photos/id/10/600/400" alt="Nature 1">
    </div>
    <div class="gallery-item" data-category="tech">
      <img src="https://picsum.photos/id/180/600/400" alt="Tech 1">
    </div>
    <div class="gallery-item" data-category="nature">
      <img src="https://picsum.photos/id/29/600/400" alt="Nature 2">
    </div>
    <div class="gallery-item" data-category="tech">
      <img src="https://picsum.photos/id/1/600/400" alt="Tech 2">
    </div>
    <div class="gallery-item" data-category="nature">
      <img src="https://picsum.photos/id/15/600/400" alt="Nature 3">
    </div>
    <div class="gallery-item" data-category="tech">
      <img src="https://picsum.photos/id/96/600/400" alt="Tech 3">
    </div>
  </div>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox">
    <span class="close">&times;</span>
    <span class="prev">&#10094;</span>
    <img class="lightbox-img" src="" alt="">
    <span class="next">&#10095;</span>
  </div>

  <script>
    const galleryItems = document.querySelectorAll('.gallery-item');
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.querySelector('.lightbox-img');
    const closeBtn = document.querySelector('.close');
    const prevBtn = document.querySelector('.prev');
    const nextBtn = document.querySelector('.next');
    const filterBtns = document.querySelectorAll('.filter-btn');

    let currentIndex = 0;
    let images = [];

    // Update images array
    function updateImages() {
      images = Array.from(document.querySelectorAll('.gallery-item'))
       .filter(item => item.style.display!== 'none')
       .map(item => item.querySelector('img').src);
    }

    // Open Lightbox
    galleryItems.forEach((item, index) => {
      item.addEventListener('click', () => {
        updateImages();
        currentIndex = images.indexOf(item.querySelector('img').src);
        showImage();
        lightbox.style.display = 'flex';
      });
    });

    function showImage() {
      lightboxImg.src = images[currentIndex];
    }

    // Navigation
    nextBtn.addEventListener('click', () => {
      currentIndex = (currentIndex + 1) % images.length;
      showImage();
    });
    prevBtn.addEventListener('click', () => {
      currentIndex = (currentIndex - 1 + images.length) % images.length;
      showImage();
    });

    // Close
    closeBtn.addEventListener('click', () => lightbox.style.display = 'none');
    lightbox.addEventListener('click', (e) => {
      if(e.target === lightbox) lightbox.style.display = 'none';
    });

    // Filter Functionality
    filterBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        filterBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const filter = btn.dataset.filter;

        galleryItems.forEach(item => {
          if(filter === 'all' || item.dataset.category === filter) {
            item.style.display = 'block';
          } else {
            item.style.display = 'none';
          }
        });
      });
    });

    // Keyboard support
    document.addEventListener('keydown', (e) => {
      if(lightbox.style.display === 'flex') {
        if(e.key === 'ArrowRight') nextBtn.click();
        if(e.key === 'ArrowLeft') prevBtn.click();
        if(e.key === 'Escape') closeBtn.click();
      }
    });
  </script>
</body>
</html>
